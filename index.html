<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css" integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg==" crossorigin="anonymous" referrerpolicy="no-referrer">
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap" rel="stylesheet">
    <title>Counter App</title>
</head>
<body>
    <main>
        <h1>Counter App</h1>

        <hr>
        
        <div class="main-container">
        <div id="counter-container">
            <span id="counter-value" aria-live="polite">0</span>
        </div>

        <div id="buttons">
            <button id="decrement-btn" aria-label="Decrease count">-</button>
            <button id="reset-btn" aria-label="Reset Count">Reset<i class="fa-solid fa-rotate-left" aria-hidden="true"></i></button>
            <button id="increment-btn" aria-label="Increase count">+</button>
        </div>
        </div>

    </main>
    <script src="script.js"></script>
</body>
</html>
